upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 300
max_input_time = 300
display_errors = Off
log_errors = On

; Admin/POS sessions last one 8-hour shift of idle time (includes/admin-session.php);
; keep PHP's garbage collector from deleting them sooner. 8h + 30 min.
session.gc_maxlifetime = 30600
